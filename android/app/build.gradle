plugins {
    id 'com.android.application'
}

android {
    namespace 'com.heyme.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.heyme.app'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1.${System.getenv("GITHUB_RUN_NUMBER") ?: "0"}"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // One fixed key, so new builds install right over old ones.
    signingConfigs {
        heyme {
            storeFile file('heyme.keystore')
            storePassword 'heyme-app'
            keyAlias 'heyme'
            keyPassword 'heyme-app'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.heyme
        }
        debug {
            signingConfig signingConfigs.heyme
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation('com.alphacephei:vosk-android:0.3.47') {
        exclude group: 'net.java.dev.jna'
    }
}
