# Builds the Hey Me Android app (HeyMe.apk) automatically on GitHub.
# Every time you upload changes, a new HeyMe.apk appears under "Releases".
name: Build Hey Me Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download the "Hey Me" wake word model
        run: |
          curl -L --fail -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/model-en-us
          mv vosk-model-small-en-us-0.15 android/app/src/main/assets/model-en-us
          echo "vosk-model-small-en-us-0.15" > android/app/src/main/assets/model-en-us/uuid

      - name: Build the app
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Name it HeyMe.apk
        run: cp android/app/build/outputs/apk/release/app-release.apk HeyMe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HeyMe-apk
          path: HeyMe.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Hey Me app (build ${{ github.run_number }})
          body: Download HeyMe.apk below and put it in the server's "apps" folder.
          files: HeyMe.apk
